# .github/workflows/deploy.yml
#
# Triggers Vercel deployment whenever:
#   • A blog post is published/edited/deleted (content/blogs/** changes)
#   • Any source code changes are pushed to main
#
# Required GitHub repository secrets:
#   VERCEL_TOKEN       — from vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID      — from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  — from .vercel/project.json after `vercel link`

name: Deploy to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'content/**'
      - 'api/**'
      - 'package.json'
      - 'vite.config.js'
      - 'vercel.json'
      - 'index.html'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node setup ────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Install dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Generate feeds (sitemap, RSS) ─────────────────────────────
      - name: Generate sitemap & RSS
        run: node scripts/generate-feeds.js

      # ── Build ─────────────────────────────────────────────────────
      - name: Build Vite app
        run: npm run build
        env:
          NODE_ENV: production

      # ── Deploy to Vercel ──────────────────────────────────────────
      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: '.'

  # ── Notify on failure ─────────────────────────────────────────────
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Log failure
        run: echo "Deployment failed. Check Actions logs."
